[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "dataset-gate"
version = "0.2.0"
description = "Data contracts and reproducible quality gates for CSV-based ML pipelines."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "Pralav Singh"}]
dependencies = []
[project.optional-dependencies]
api = ["fastapi==0.141.1", "uvicorn==0.53.0"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.16.8", "build==1.6.1"]
[project.scripts]
dataset-gate = "dataset_gate.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
dataset_gate = ["templates/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
